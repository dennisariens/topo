<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAFAF9">
<meta name="description" content="Nino Topo — ontdek landen en leer topografie.">
<title>Nino Topo — Waar gaan we vandaag naartoe?</title>
<link rel="icon" href="../assets/nino-topo/v3-r2/brand/icons/vespa-premium-192.png">
<style>
:root{color-scheme:light;--bg:#FAFAF9;--surface:#fff;--ink:#171B20;--secondary:#73737D;--line:#E5E5EA;--lav:#9781D5;--lav-dark:#7b66b7;--lav-soft:#D3C7ED;--lav-tint:#F1EDFA}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}.skip{position:absolute;top:-70px;left:12px;background:white;padding:12px;z-index:20}.skip:focus{top:12px}a:focus-visible{outline:3px solid var(--lav);outline-offset:4px}
.shell{max-width:1280px;margin:auto;padding:0 38px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;height:100px;border-bottom:1px solid #EEEEF1}
.brand{display:flex;align-items:center;height:75px;max-width:280px}.brand img{display:block;width:100%;height:73px;object-fit:contain;object-position:left}.brand .compact{display:none}.brand-fallback{font-size:34px;font-weight:800;letter-spacing:-.06em}.brand-fallback b{color:var(--lav)}.tagline{font-size:10px;letter-spacing:.18em;font-weight:700;color:#92929A}
.hero{text-align:center;padding:65px 12px 44px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:750;color:var(--lav-dark);margin-bottom:17px}.hero h1{font-size:clamp(31px,4.4vw,54px);line-height:1.13;letter-spacing:-.045em;margin:0;font-weight:750}.hero p{font-size:16px;color:var(--secondary);line-height:1.6;margin:18px 0 0}
.landscape{position:relative;padding-bottom:74px}.grid{display:grid;gap:22px}.featured{grid-template-columns:repeat(2,minmax(0,1fr))}.future{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:22px}
.country{overflow:hidden;position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 14px rgba(25,20,35,.035),0 19px 42px rgba(25,20,35,.025)}
.visual{height:245px;position:relative;overflow:hidden;background:#F1EFF1}.visual img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s ease,transform .6s ease}.visual img.alt{opacity:0}
.country:hover .visual img.alt,.country:focus-within .visual img.alt,.country:focus-visible .visual img.alt{opacity:1}.country:hover .visual img.base,.country:focus-within .visual img.base,.country:focus-visible .visual img.base{opacity:0}
.country:hover .visual img{transform:scale(1.025)}.country:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.country .bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:21px 22px 24px;min-height:102px}.title{min-width:0}h2,h3{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:22px;letter-spacing:-.025em}p.description{margin:0;font-size:13px;color:var(--secondary);line-height:1.45}
.flag{height:18px;width:26px;display:inline-block;flex-shrink:0;border:1px solid #0001;border-radius:3px;box-shadow:0 1px 2px #0002}.it{background:linear-gradient(90deg,#009246 33.33%,#fff 33.33% 66.66%,#ce2b37 66.66%)}.fr{background:linear-gradient(90deg,#002395 33.33%,#fff 33.33% 66.66%,#ed2939 66.66%)}.es{background:linear-gradient(#aa151b 25%,#f1bf00 25% 75%,#aa151b 75%)}.de{background:linear-gradient(#111 33.33%,#dd0000 33.33% 66.66%,#ffce00 66.66%)}.nl{background:linear-gradient(#ae1c28 33.33%,#fff 33.33% 66.66%,#21468b 66.66%)}
.action,.soon{display:inline-flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap;border-radius:99px;font-size:12px;font-weight:650;line-height:1.2}
.action{background:var(--lav);color:#fff;padding:13px 18px;min-height:44px;text-decoration:none}.action:hover{background:var(--lav-dark)}
.pending{background:var(--lav-tint);border:1px solid var(--lav-soft);color:#685398;padding:12px 15px}
.soon{border:1px solid var(--lav-soft);background:var(--lav-tint);color:#7761AD;padding:8px 12px}
.soon svg{width:12px;height:12px}
.future .visual{height:145px}.future .visual img{filter:grayscale(1)}.future .visual img.base{opacity:.38}.future:hover .visual img.base,.future:focus-visible .visual img.base{opacity:0}.future:hover .visual img.alt,.future:focus-visible .visual img.alt{opacity:.43}.future h3{font-size:18px;margin:0}.future .bottom{min-height:72px;padding:16px 18px 18px}
.mascot{position:absolute;width:130px;height:135px;object-fit:contain;bottom:4px;left:-44px;pointer-events:none}
footer{margin-top:auto;border-top:1px solid #EEEEF1;padding:24px 0 32px;display:flex;justify-content:space-between;gap:16px;color:#9999A3;font-size:11px}
@media(max-width:900px){.shell{padding:0 24px}.featured .bottom{flex-wrap:wrap}.visual{height:205px}.future .visual{height:120px}.mascot{left:-15px;width:95px}}
@media(max-width:650px){.shell{padding:0 16px}header{height:78px}.tagline{display:none}.brand .primary{display:none}.brand .compact{display:block}.brand img{height:60px;max-width:180px}.hero{padding:50px 0 30px}.hero h1{font-size:33px}.hero p{font-size:14px}.featured,.future{grid-template-columns:1fr;gap:14px}.future{margin-top:16px}.visual{height:210px}.future .visual{height:116px}.country .bottom{padding:16px}.mascot{display:none}.landscape{padding-bottom:40px}footer{flex-direction:column;align-items:center;gap:6px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.visual img{transition:none!important;transform:none!important}}
</style>
</head>
<body>
<a class="skip" href="#landen">Ga naar de landen</a>
<div class="shell">
<header>
<a href="./" class="brand" aria-label="Nino Topo startpagina">
<picture class="primary"><img src="../assets/nino-topo/v3-r2/brand/logo/logo-01-primary.svg" alt="Nino Topo" width="280" height="73"></picture>
<picture class="compact"><img src="../assets/nino-topo/v3-r2/brand/logo/logo-02-compact.svg" alt="Nino" width="180" height="60"></picture>
</a>
<span class="tagline">LEREN, LAND VOOR LAND</span>
</header>
<main>
<section class="hero" aria-labelledby="hero-title">
<div class="eyebrow">ONTDEK DE WERELD MET NINO</div>
<h1 id="hero-title">Waar gaan we vandaag naartoe?</h1>
<p>Ontdek landen, leer steden, regio’s, rivieren en bergen.</p>
</section>
<section class="landscape" id="landen" aria-label="Kies een land">
<div class="grid featured" id="featured"></div>
<div class="grid future" id="future"></div>
<img class="mascot" alt="" aria-hidden="true" src="../assets/nino-topo/v3-r2/brand/characters/nino-vespa-canonical.webp">
</section>
</main>
<footer><span>© <span id="year">2026</span> Nino Topo</span><span>De wereld leren kennen, land voor land.</span></footer>
</div>
<script>
const base='../assets/nino-topo/v3-r2/destinations/';
const countries=[
 {id:'italy',name:'Italië',flag:'it',desc:'Steden, bergen, meren en rivieren.',active:true},
 {id:'france',name:'Frankrijk',flag:'fr',desc:'Ontdek regio’s, steden en landschappen.',active:true},
 {id:'spain',name:'Spanje',flag:'es'},
 {id:'germany',name:'Duitsland',flag:'de'},
 {id:'netherlands',name:'Nederland',flag:'nl'}
];
// Do not fabricate a learning-app route. Set only after verification.
const routes={italy:null,france:null};
const lock='<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="5" y="9" width="10" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="1.5"/></svg>';
for(const c of countries){
 const card=document.createElement('article');card.className='country '+(c.active?'active':'future');card.tabIndex=0;card.setAttribute('aria-label',c.name+(c.active?' — leeromgeving wordt gekoppeld':' — binnenkort beschikbaar'));
 const h=c.active?'h2':'h3';const src=base+c.id+'-';
 const action=c.active?(routes[c.id]?'<a class="action" href="'+routes[c.id]+'">Start leren →</a>':'<span class="action pending">Leeromgeving volgt</span>'):'<span class="soon">'+lock+' Binnenkort</span>';
 const text=c.desc?'<p class="description">'+c.desc+'</p>':'';
 card.innerHTML='<div class="visual"><img class="base" src="'+src+'destination.webp" alt="Illustratie van '+c.name+'" '+(c.id==='italy'?'fetchpriority="high"':'loading="lazy"')+'><img class="alt" src="'+src+'hover.webp" alt="" loading="lazy"></div><div class="bottom"><div class="title"><'+h+'><span class="flag '+c.flag+'" role="img" aria-label="Vlag van '+c.name+'"></span>'+c.name+'</'+h+'>'+text+'</div>'+action+'</div>';
 document.getElementById(c.active?'featured':'future').append(card);
}
document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
