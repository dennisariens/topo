{
  "name": "TOPO harness quality gate",
  "on": {
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "topo-harness-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Checkout exact candidate",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Supported Node LTS",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.22.1"
          }
        },
        {
          "name": "Install locked development dependencies",
          "run": "npm ci --ignore-scripts --no-audit --no-fund\nnpm ci --prefix .harness/tooling --ignore-scripts --no-audit --no-fund",
          "timeout-minutes": 5
        },
        {
          "name": "Install required development browsers",
          "run": "node .harness/tooling/node_modules/playwright/cli.js install --with-deps chromium webkit",
          "timeout-minutes": 10
        },
        {
          "name": "Execute required quality gate",
          "run": "if [ -f scripts/harness/v2/gate.mjs ]; then node scripts/harness/v2/gate.mjs; else ./check.sh TOPO-HARNESS-001; fi",
          "timeout-minutes": 25
        },
        {
          "name": "Retain exact gate evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "topo-harness-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": ".harness/tasks/TOPO-HARNESS-001/\n.harness/tasks/TOPO-HARNESS-002/\n.harness/tasks/TOPO-PILOT-001/",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
